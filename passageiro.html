<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retorno da Excursão</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white; padding: 30px 20px; border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 40px;
    }
    h1 { color: #333; font-size: 1.6rem; }
    p { color: #666; line-height: 1.5; margin-bottom: 25px; }
    .btn-rota {
      display: inline-block; width: 100%; box-sizing: border-box;
      background: #007bff; color: white; text-decoration: none;
      padding: 16px; border-radius: 10px; font-weight: bold; font-size: 1.1rem;
      box-shadow: 0 4px 6px rgba(0,123,255,0.2);
    }
    .no-gps { background: #dc3545; color: white; padding: 15px; border-radius: 8px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div style="font-size: 3rem;">🚌</div>
    <h1>Dados do Retorno</h1>
    
    <!-- Bloco de Informações de Texto (Plano B) -->
    <div id="info-texto" style="background: #e9ecef; padding: 15px; border-radius: 10px; margin: 20px 0; text-align: left; border-left: 5px solid #ffc107;">
      <p style="margin: 0 0 8px 0; color: #333;"><strong>📍 Local de Encontro:</strong> <span id="txt-local">Carregando...</span></p>
      <p style="margin: 0; color: #333;"><strong>⏰ Horário de Partida:</strong> <span id="txt-horario">Carregando...</span></p>
    </div>

    <!-- Opção A: Rota pelo Mapa -->
    <div id="bloco-mapa">
      <p>Clique no botão abaixo para abrir o mapa com a rota de caminhada de onde você está até o ônibus.</p>
      <a id="link-mapa" href="#" target="_blank" class="btn-rota">🚶‍♂️ Traçar Rota de Volta</a>
    </div>
    
    <div id="aviso-erro" class="no-gps" style="display: none; background: #dc3545; color: white; padding: 15px; border-radius: 8px;">
      O organizador ainda não liberou as informações de retorno para esta viagem.
    </div>
  </div>

  <script>
    // 1. Recupera as informações salvas na memória
    const ponto = JSON.parse(localStorage.getItem('pontoEncontro'));
    const btnRota = document.getElementById('link-mapa');
    const blocoMapa = document.getElementById('bloco-mapa');
    const avisoErro = document.getElementById('aviso-erro');
    const infoTexto = document.getElementById('info-texto');

    // 2. Verifica se existem dados cadastrados pelo guia
    if (ponto && (ponto.local || ponto.lat)) {
      
      // Preenche os campos de texto (Plano B sempre visível)
      document.getElementById('txt-local').innerText = ponto.local || "Não informado";
      document.getElementById('txt-horario').innerText = ponto.horario || "Não informado";

      // Verifica se temos as coordenadas do GPS para liberar o botão do mapa (Opção A)
      if (ponto.lat && ponto.lng) {
        const latitude = parseFloat(ponto.lat);
        const longitude = parseFloat(ponto.lng);
        btnRota.href = `https://google.com{latitude},${longitude}&travelmode=walking`;
      } else {
        // Se o guia salvou sem GPS, esconde o bloco do botão do mapa de forma amigável
        blocoMapa.style.display = 'none';
      }

    } else {
      // Se não houver dado nenhum salvo
      infoTexto.style.display = 'none';
      blocoMapa.style.display = 'none';
      avisoErro.style.display = 'block';
    }
  </script>
</body>

</html>
